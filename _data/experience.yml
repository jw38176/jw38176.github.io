    date_label: Jul. 2022 – Sept. 2022
    highlights:
      - Reshaped and modernized the Instruction Architecture and Compiler senior year course by targeting RISC-V and building a RV32I compliant CPU with cache and exception handling using SystemVerilog, led by Professor Peter Cheung.

  - position: Data Analysis Intern
    name: Tencent Music Entertainment Group
    logo: /assets/images/badges/logo-tme.avif
